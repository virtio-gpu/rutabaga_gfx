[api]
name = "magma"
major_version = 0
minor_version = 6
patch_version = 7

[copyright]
spdx = "MIT"
holder = "The Magma GPU Project"
year = 2026

# Locations relative to the required '--out-dir' parameter where generated code
# will be placed
[out_dir_info.client]
ffi = "ffi/magma_ffi/autogenerated.rs"
header = "ffi/magma_ffi/include/magma.h"
protocol = "magma/protocol.rs"
protocol_impl = "magma/protocol_impl.rs"
encoder = "magma/encoder.rs"
decoder = "magma/decoder.rs"

[out_dir_info.server]
protocol = "protocol.rs"
protocol_impl = "protocol_impl.rs"
encoder = "decoder.rs"
decoder = "decoder.rs"

[ffi]
crate_name = "magma_gpu_magma"
exclude_imports = [
    "MagmaStatus",
    "MagmaVendorId",
]
status_types = [
    "MagmaStatus",
]
structure_type_header = "MagmaStructureTypeHeader"
structure_type_enum = "MagmaStructureType"
custom_imports = [
    "use magma_gpu_magma::{MagmaError, MagmaResult};",
]

[ffi.handle_conversions]
MagmaSyncObj = "as_raw_handle().unwrap_or(0)"

[encoder]
protocol_import = "use crate::protocol::*;"
custom_imports = [
    "use magma_gpu::util::Writer;",
]

[decoder]
protocol_import = "use crate::protocol::*;"
custom_imports = [
    "use magma_gpu::util::Reader;",
]
